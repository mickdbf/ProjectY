<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EasyNote AI – Smarter Note-Taking</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(25px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .fade-up { animation: fadeUp 1s ease-out both; }

    body {
      background: linear-gradient(rgba(248, 250, 255, 0.9), rgba(255, 255, 255, 0.95)),
        url('https://media.istockphoto.com/id/173153967/photo/blue-graph-paper-background-textured.jpg?s=612x612&w=0&k=20&c=hZQ5_Hzo7tpgMOkbmqDJMc89WzEQx2zLU7tU6SWyOa0=');
      background-size: cover;
      background-attachment: fixed;
      background-position: center;
      background-repeat: no-repeat;
      font-family: 'Inter', sans-serif;
    }

    .glass {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(8px);
    }
  </style>
</head>

<body class="text-gray-800">
  <header class="bg-white/80 backdrop-blur-md shadow-sm py-4 px-8 flex justify-between items-center fixed top-0 left-0 right-0 z-50">
    <h1 class="text-2xl font-bold text-blue-700 tracking-tight">
      EasyNote <span class="text-indigo-600">AI</span>
      <span class="text-sm text-indigo-400 font-normal ml-2">by Everyday Intelligence</span>
    </h1>
  </header>

  <section class="pt-36 pb-20 text-center fade-up">
    <h2 class="text-5xl font-bold text-blue-700 mb-4">Turn Lectures into Organized Notes</h2>
    <p class="text-gray-700 mb-10 text-lg">Upload lecture slides and let AI create perfect notes — automatically saved to Google Drive.</p>

    <div class="mx-auto glass shadow-lg rounded-2xl p-10 w-full max-w-md border border-gray-100">
      <h3 class="text-xl font-semibold mb-6 text-gray-800">Sign in to Begin</h3>
      <button onclick="window.location.href='/app'"
              class="w-full bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-700 hover:to-indigo-700 text-white font-semibold py-3 rounded-xl shadow-md transition transform hover:scale-[1.02]">
        Continue with Google
      </button>
    </div>
  </section>

  <footer class="bg-white/80 backdrop-blur-md text-gray-500 text-sm py-6 text-center border-t border-gray-200">
    © 2025 EasyNote AI by Everyday Intelligence
  </footer>
</body>
</html>
