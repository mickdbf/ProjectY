name: Deploy to Cloud Run

on:
  push:
    branches:
      - prod  # change to your deployment branch

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2.2.0
        with:
          service_account_key: ${{ secrets.GCP_SA_KEY }}
          project_id: ${{ secrets.PROJECT_ID }}

      - name: Build and push Docker image
        run: |
          IMAGE="gcr.io/${{ secrets.PROJECT_ID }}/projectx:${GITHUB_SHA}"
          docker build -t $IMAGE .
          docker push $IMAGE

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy projectx \
            --image gcr.io/${{ secrets.PROJECT_ID }}/projectx:${GITHUB_SHA} \
            --region ${{ secrets.REGION }} \
            --platform managed \
            --allow-unauthenticated  # remove if you want private
