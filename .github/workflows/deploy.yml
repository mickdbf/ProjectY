name: Deploy to Cloud Run

on:
  push:
    branches:
      - prod  # name of the push to deploy branch

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      # Authenticate using your service account JSON stored in GitHub Secrets
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v1
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      # Set up gcloud CLI
      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2.2.0
        with:
          project_id: ${{ secrets.PROJECT_ID }}

      # Build Docker image
      - name: Build Docker image
        run: |
          docker build -t gcr.io/${{ secrets.PROJECT_ID }}/myapp:${{ github.sha }} .

      # Configure Docker Auth
      - name: Configure Docker authentication
        run: |
          gcloud auth configure-docker

      # Push Docker image
      - name: Push Docker image
        run: |
          docker push gcr.io/${{ secrets.PROJECT_ID }}/myapp:${{ github.sha }}

      # Deploy to Cloud Run
      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy myapp \
          --image gcr.io/${{ secrets.PROJECT_ID }}/myapp:${{ github.sha }} \
          --region us-central1 \
          --platform managed \
          --allow-unauthenticated
