steps:
  # Build Docker image
  - name: gcr.io/cloud-builders/docker
    args:
      ["build", "-t", "gcr.io/$projectx-469323/myapp:$COMMIT_SHA", "."]

  # Push image to Artifact Registry
  - name: gcr.io/cloud-builders/docker
    args:
      ["push", "gcr.io/$projectx-469323/myapp:$COMMIT_SHA"]

  # Deploy to Cloud Run
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      [
        "run", "deploy", "myapp",
        "--image", "gcr.io/$projectx-469323/myapp:$COMMIT_SHA",
        "--region", "us-central1",
        "--platform", "managed"
      ]

# Send logs only to Cloud Logging (avoids service account issues)
options:
  logging: CLOUD_LOGGING_ONLY
